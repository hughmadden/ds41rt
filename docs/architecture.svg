<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DS4RT system architecture</title>
  <desc id="desc">One RTX PRO 6000 coordinator runs the API, attention, cache, routing, shared experts and sampling. Four DGX Sparks each hold a tensor-parallel quarter of every routed expert and return partial hidden rows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091521"/><stop offset="1" stop-color="#13283a"/></linearGradient>
    <linearGradient id="coord" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174d68"/><stop offset="1" stop-color="#1f7183"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#44306d"/><stop offset="1" stop-color="#7656a8"/></linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53d3d1"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f4bd5b"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="600" y="48" fill="#f5f9fc" font-family="system-ui,sans-serif" font-size="28" font-weight="700" text-anchor="middle">DS4RT — attention–FFN disaggregation for DeepSeek V4 Pro</text>
  <text x="600" y="78" fill="#9fb8c8" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">One residual stream • global top-6 routes • four fixed TP expert slices</text>

  <g filter="url(#shadow)">
    <rect x="55" y="116" width="470" height="510" rx="22" fill="url(#coord)" stroke="#65dcda" stroke-width="2"/>
    <rect x="675" y="116" width="470" height="510" rx="22" fill="#172033" stroke="#a78bdb" stroke-width="2"/>
  </g>
  <text x="290" y="157" fill="#fff" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle">RTX PRO 6000 coordinator</text>
  <text x="290" y="184" fill="#bdebea" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">x86_64 • sm_120 • 96 GB</text>
  <text x="910" y="157" fill="#fff" font-family="system-ui,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Four DGX Spark expert ranks</text>
  <text x="910" y="184" fill="#d9cef1" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">ARM64 • sm_121 • one quarter of every routed expert per rank</text>

  <g font-family="system-ui,sans-serif" font-size="16" fill="#f4fbfd">
    <rect x="91" y="222" width="398" height="60" rx="12" fill="#0f3448"/><text x="290" y="248" text-anchor="middle" font-weight="650">OpenAI API + continuous scheduler</text><text x="290" y="270" text-anchor="middle" fill="#acd3de" font-size="14">admission • tokenizer • sampling • constraints</text>
    <rect x="91" y="298" width="398" height="60" rx="12" fill="#0f3448"/><text x="290" y="324" text-anchor="middle" font-weight="650">MLA attention + physical KV</text><text x="290" y="346" text-anchor="middle" fill="#acd3de" font-size="14">C0 / C4 / C128 • compressors • indexers • RoPE</text>
    <rect x="91" y="374" width="398" height="60" rx="12" fill="#0f3448"/><text x="290" y="400" text-anchor="middle" font-weight="650">mHC + router + shared expert</text><text x="290" y="422" text-anchor="middle" fill="#acd3de" font-size="14">one global residual stream and route list</text>
    <rect x="91" y="450" width="398" height="60" rx="12" fill="#0f3448"/><text x="290" y="476" text-anchor="middle" font-weight="650">Three-block dSpark controller</text><text x="290" y="498" text-anchor="middle" fill="#acd3de" font-size="14">adaptive 1–5 token proposals • target verification</text>
    <rect x="91" y="526" width="398" height="60" rx="12" fill="#0f3448"/><text x="290" y="552" text-anchor="middle" font-weight="650">Final norm + LM head</text><text x="290" y="574" text-anchor="middle" fill="#acd3de" font-size="14">logits • constrained mask • token output</text>
  </g>

  <g font-family="system-ui,sans-serif" fill="#fff">
    <g><rect x="714" y="217" width="392" height="75" rx="14" fill="url(#spark)"/><text x="746" y="248" font-size="19" font-weight="700">spark-0</text><text x="746" y="273" font-size="14" fill="#ded5f2">w1/w3/w2 intermediate slice 0 of 4</text></g>
    <g><rect x="714" y="309" width="392" height="75" rx="14" fill="url(#spark)"/><text x="746" y="340" font-size="19" font-weight="700">spark-1</text><text x="746" y="365" font-size="14" fill="#ded5f2">w1/w3/w2 intermediate slice 1 of 4</text></g>
    <g><rect x="714" y="401" width="392" height="75" rx="14" fill="url(#spark)"/><text x="746" y="432" font-size="19" font-weight="700">spark-2</text><text x="746" y="457" font-size="14" fill="#ded5f2">w1/w3/w2 intermediate slice 2 of 4</text></g>
    <g><rect x="714" y="493" width="392" height="75" rx="14" fill="url(#spark)"/><text x="746" y="524" font-size="19" font-weight="700">spark-3</text><text x="746" y="549" font-size="14" fill="#ded5f2">w1/w3/w2 intermediate slice 3 of 4</text></g>
  </g>

  <path d="M505 334 C570 334 603 260 693 260" fill="none" stroke="#53d3d1" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M505 354 C585 354 605 345 693 345" fill="none" stroke="#53d3d1" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M505 374 C585 374 605 438 693 438" fill="none" stroke="#53d3d1" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <path d="M505 394 C570 394 603 530 693 530" fill="none" stroke="#53d3d1" stroke-width="5" marker-end="url(#arrowCyan)"/>
  <text x="602" y="310" fill="#89ecea" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">same hidden rows</text>
  <text x="602" y="328" fill="#89ecea" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">+ top-6 routes</text>

  <path d="M693 579 C615 618 568 611 505 558" fill="none" stroke="#f4bd5b" stroke-width="5" marker-end="url(#arrowGold)"/>
  <text x="615" y="643" fill="#ffd884" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">four hidden-width partials → deterministic or row-sharded reduction</text>
  <text x="600" y="690" fill="#8ba4b5" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Protocol V2 • native verbs • optional second reduction rail • GPU-resident EXL3 experts</text>
</svg>

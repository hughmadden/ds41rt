<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">DS4RT request and sparse-block path</title>
  <desc id="desc">A request is admitted and prefills attention state. Each sparse block runs a coordinator graph segment, dispatches one global route to all Sparks, reduces four partials, and runs a second graph segment. dSpark proposes tokens and the target verifies them before streaming output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1420"/><stop offset="1" stop-color="#18283a"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#74dedb"/></marker>
  </defs>
  <rect width="1400" height="560" rx="24" fill="url(#bg)"/>
  <text x="700" y="45" fill="#f5f9fc" font-family="system-ui,sans-serif" font-size="27" font-weight="700" text-anchor="middle">One DS4RT request</text>
  <text x="700" y="73" fill="#9db4c6" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">Prepared CUDA graphs surround a real four-rank expert barrier</text>

  <g font-family="system-ui,sans-serif" font-size="15">
    <text x="30" y="135" fill="#8fa8ba" font-weight="700">CLIENT / API</text><line x1="145" y1="130" x2="1370" y2="130" stroke="#385168"/>
    <text x="30" y="245" fill="#8fa8ba" font-weight="700">COORDINATOR</text><line x1="145" y1="240" x2="1370" y2="240" stroke="#385168"/>
    <text x="30" y="355" fill="#8fa8ba" font-weight="700">4 × SPARK</text><line x1="145" y1="350" x2="1370" y2="350" stroke="#385168"/>
    <text x="30" y="465" fill="#8fa8ba" font-weight="700">OUTPUT</text><line x1="145" y1="460" x2="1370" y2="460" stroke="#385168"/>
  </g>

  <g font-family="system-ui,sans-serif" fill="#fff">
    <g><rect x="165" y="99" width="145" height="62" rx="12" fill="#22546c"/><text x="237" y="125" text-anchor="middle" font-size="16" font-weight="700">Chat request</text><text x="237" y="146" text-anchor="middle" font-size="13" fill="#bce5ec">admit + tokenize</text></g>
    <g><rect x="342" y="209" width="160" height="62" rx="12" fill="#1d6878"/><text x="422" y="235" text-anchor="middle" font-size="16" font-weight="700">Prefill / KV</text><text x="422" y="256" text-anchor="middle" font-size="13" fill="#bdebea">C0 • C4 • C128</text></g>
    <g><rect x="535" y="199" width="190" height="82" rx="12" fill="#1d6878"/><text x="630" y="226" text-anchor="middle" font-size="16" font-weight="700">Graph segment A</text><text x="630" y="248" text-anchor="middle" font-size="13" fill="#bdebea">attention → mHC → route</text><text x="630" y="267" text-anchor="middle" font-size="13" fill="#bdebea">+ shared expert</text></g>
    <g><rect x="758" y="309" width="190" height="82" rx="12" fill="#66508f"/><text x="853" y="336" text-anchor="middle" font-size="16" font-weight="700">TP4 experts</text><text x="853" y="358" text-anchor="middle" font-size="13" fill="#e2d9f4">same top-6 routes</text><text x="853" y="377" text-anchor="middle" font-size="13" fill="#e2d9f4">four partial outputs</text></g>
    <g><rect x="981" y="199" width="190" height="82" rx="12" fill="#1d6878"/><text x="1076" y="226" text-anchor="middle" font-size="16" font-weight="700">Graph segment B</text><text x="1076" y="248" text-anchor="middle" font-size="13" fill="#bdebea">reduce → mHC</text><text x="1076" y="267" text-anchor="middle" font-size="13" fill="#bdebea">advance residual</text></g>
    <g><rect x="1205" y="199" width="145" height="82" rx="12" fill="#8d5d2d"/><text x="1277" y="226" text-anchor="middle" font-size="16" font-weight="700">dSpark</text><text x="1277" y="248" text-anchor="middle" font-size="13" fill="#ffe0a8">draft 1–5</text><text x="1277" y="267" text-anchor="middle" font-size="13" fill="#ffe0a8">target verify</text></g>
    <g><rect x="1188" y="429" width="179" height="62" rx="12" fill="#2b7566"/><text x="1277" y="455" text-anchor="middle" font-size="16" font-weight="700">Stream tokens</text><text x="1277" y="476" text-anchor="middle" font-size="13" fill="#c9eee4">usage + finish state</text></g>
  </g>

  <g fill="none" stroke="#74dedb" stroke-width="4" marker-end="url(#a)">
    <path d="M310 130 C330 130 325 240 342 240"/>
    <path d="M502 240 L535 240"/>
    <path d="M725 240 C747 240 740 350 758 350"/>
    <path d="M948 350 C971 350 960 240 981 240"/>
    <path d="M1171 240 L1205 240"/>
    <path d="M1277 281 L1277 429"/>
  </g>
  <path d="M1317 199 C1345 169 1205 165 1118 198" fill="none" stroke="#f3bd63" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="1241" y="165" fill="#ffd487" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">repeat target blocks / verification</text>

  <text x="700" y="530" fill="#8fa8ba" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">No timed graph captures • no Python on the request hot path • physical KV remains coordinator-local</text>
</svg>

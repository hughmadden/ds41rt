<text x="778" y="694" class="body" text-anchor="start">Send activations and routing</text>
<text x="778" y="716" class="body" text-anchor="start">Four ranks compute TP slices</text>
<text x="778" y="738" class="body" text-anchor="start">Sum returns; join shared output</text>
<text x="778" y="760" class="body" text-anchor="start">Advance this layer’s residual</text>

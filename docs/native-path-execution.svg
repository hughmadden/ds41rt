<text x="368" y="464" class="label" text-anchor="start">2 · Embed and prepare known tokens</text>
<text x="368" y="490" class="body" text-anchor="start">Text embeddings and residual input · start Engram gathers for both layers</text>
<text x="368" y="512" class="body" text-anchor="start">Fresh prefill builds encoder sources; decoder prefill uses the final 128 rows</text>

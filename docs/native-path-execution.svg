<text x="369" y="594" class="section" text-anchor="start">3 · TARGET BACKBONE · 40 LAYERS</text>
<text x="369" y="618" class="small" text-anchor="start">128-token local windows · four shared global KV sources at layers 2 / 8 / 14 / 20</text>

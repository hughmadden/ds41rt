<text x="1223" y="897" class="body" text-anchor="start">Three draft stages, including experts</text>
<text x="1223" y="919" class="body" text-anchor="start">Condition on target layers 37 / 38 / 39</text>
<text x="1223" y="941" class="body" text-anchor="start">Propose → target verify → accept</text>
<text x="1223" y="963" class="body" text-anchor="start">Target-only mode omits drafting</text>
<path d="M1205 913 H1144" fill="none" stroke="#46d7e8" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="44" y="1025" width="1512" height="121" rx="12" fill="#0b192a" stroke="#203a55" stroke-width="1.3"/>
<text x="66" y="1056" class="label" text-anchor="start">TWO LANES · UP TO EIGHT REQUESTS PER LANE</text>
<text x="66" y="1082" class="body" text-anchor="start">Independent target stacks overlap around remote expert work. Admission, migration and retirement occur after both stacks drain.</text>
<text x="66" y="1107" class="body" text-anchor="start">Speculative proposals stay private until verification commits the same accepted prefix to target, draft and Engram state.</text>
<text x="44" y="1178" class="small" text-anchor="start">Native serving design · FP4 compressed KV / FP8 SWA · release qualification in progress · schematic, not a measured timeline</text>
</svg>

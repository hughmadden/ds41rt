<linearGradient id="panel" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#0d1b2d"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#46d7e8"/></marker>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#b9cde0}

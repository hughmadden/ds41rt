<text x="368" y="322" class="label" text-anchor="start">1 · Admission and prefix lookup</text>
<text x="368" y="348" class="body" text-anchor="start">Token radix → exact restoration or bounded partial replay → new suffix</text>
<text x="368" y="370" class="body" text-anchor="start">Exact prompt hits reuse saved logits; each request gets a fresh lease</text>

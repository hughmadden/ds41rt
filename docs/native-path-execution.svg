.section{font-size:20px;font-weight:700;fill:#e9f3ff}.label{font-size:17px;font-weight:700;fill:#e9f3ff}
.body{font-size:15px}.small{font-size:13px;fill:#91a8bf}.badge{font-size:18px;font-weight:700;fill:#e9f3ff}
</style></defs><rect width="1600" height="1200" fill="#07111f"/>

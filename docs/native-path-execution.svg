<text x="388" y="694" class="body" text-anchor="start">mHC, normalization, SWA</text>
<text x="388" y="716" class="body" text-anchor="start">Compression and index selection</text>
<text x="388" y="738" class="body" text-anchor="start">Engram gates at layers 1 and 14</text>
<text x="388" y="760" class="body" text-anchor="start">Router and shared expert</text>

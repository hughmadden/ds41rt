<text x="368" y="871" class="label" text-anchor="start">4 · Head, verify and commit</text>
<text x="368" y="897" class="body" text-anchor="start">Greedy target check → accept a token prefix → commit every cache owner</text>
<text x="368" y="919" class="body" text-anchor="start">Emit accepted output; retain completed target / draft tails with the token radix</text>
<text x="368" y="941" class="body" text-anchor="start">Evict old retained branches under entry and source-page capacity limits</text>

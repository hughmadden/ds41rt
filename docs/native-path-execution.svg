<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">DS41RT native execution across one coordinator and four expert workers</title>
<desc id="desc">The RTX coordinator owns admission, prefix state, attention, Engram projections, shared experts, dSpark and greedy verification. Four DGX Spark workers provide intermediate-dimension tensor-parallel routed experts. Two execution lanes serve up to sixteen requests. Partial matches replay at most 128 encoder tokens. Compressed source KV uses FP4 and window KV uses FP8. Vision accepts up to sixteen images. Final release qualification remains open.</desc>

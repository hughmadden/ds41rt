<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 Pro decode concurrency</title>
  <desc id="desc">Line chart of C1, C2 aggregate, and C4 aggregate decode tokens per second at zero, 4K, and 8K context depth.</desc>
  <rect width="900" height="520" rx="20" fill="#0d1926"/>
  <text x="450" y="39" fill="#f3f7fa" font-family="system-ui,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Pro K2 decode concurrency</text>
  <text x="450" y="64" fill="#94adbf" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">2K prompt + 128 generated tokens • aggregate throughput for C2/C4</text>
  <g stroke="#2e4356" stroke-width="1"><line x1="105" y1="420" x2="815" y2="420"/><line x1="105" y1="360" x2="815" y2="360"/><line x1="105" y1="300" x2="815" y2="300"/><line x1="105" y1="240" x2="815" y2="240"/><line x1="105" y1="180" x2="815" y2="180"/><line x1="105" y1="120" x2="815" y2="120"/><line x1="105" y1="60" x2="815" y2="60"/></g>
  <g fill="#9fb3c1" font-family="system-ui,sans-serif" font-size="13"><text x="88" y="425" text-anchor="end">0</text><text x="88" y="365" text-anchor="end">10</text><text x="88" y="305" text-anchor="end">20</text><text x="88" y="245" text-anchor="end">30</text><text x="88" y="185" text-anchor="end">40</text><text x="88" y="125" text-anchor="end">50</text><text x="88" y="65" text-anchor="end">60 tok/s</text><text x="180" y="450" text-anchor="middle">0</text><text x="460" y="450" text-anchor="middle">4K</text><text x="740" y="450" text-anchor="middle">8K context depth</text></g>
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline points="180,194 460,239 740,242" stroke="#64d8d5"/><polyline points="180,126 460,153 740,135" stroke="#f1bd5c"/><polyline points="180,95 460,97 740,116" stroke="#b58be0"/></g>
  <g fill="#0d1926" stroke-width="4"><circle cx="180" cy="194" r="6" stroke="#64d8d5"/><circle cx="460" cy="239" r="6" stroke="#64d8d5"/><circle cx="740" cy="242" r="6" stroke="#64d8d5"/><circle cx="180" cy="126" r="6" stroke="#f1bd5c"/><circle cx="460" cy="153" r="6" stroke="#f1bd5c"/><circle cx="740" cy="135" r="6" stroke="#f1bd5c"/><circle cx="180" cy="95" r="6" stroke="#b58be0"/><circle cx="460" cy="97" r="6" stroke="#b58be0"/><circle cx="740" cy="116" r="6" stroke="#b58be0"/></g>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#dce6ed"><line x1="250" y1="490" x2="280" y2="490" stroke="#64d8d5" stroke-width="4"/><text x="289" y="495">C1</text><line x1="350" y1="490" x2="380" y2="490" stroke="#f1bd5c" stroke-width="4"/><text x="389" y="495">C2 aggregate</text><line x1="520" y1="490" x2="550" y2="490" stroke="#b58be0" stroke-width="4"/><text x="559" y="495">C4 aggregate</text></g>
</svg>

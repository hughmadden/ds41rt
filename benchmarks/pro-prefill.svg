<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 Pro retained-context prefill throughput</title>
  <desc id="desc">Line chart of thousands of new tokens per second for one to thirty-two thousand token suffixes using fresh source prompts and artificial repeated-alpha retained contexts.</desc>
  <rect width="1000" height="560" rx="20" fill="#0d1926"/>
  <text x="500" y="39" fill="#f3f7fa" font-family="system-ui,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Pro K2 prefill over retained context</text>
  <text x="500" y="64" fill="#94adbf" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">Fresh source + repeated-alpha retained rows • median of two</text>
  <g stroke="#2e4356" stroke-width="1"><line x1="100" y1="430" x2="900" y2="430"/><line x1="100" y1="340" x2="900" y2="340"/><line x1="100" y1="250" x2="900" y2="250"/><line x1="100" y1="160" x2="900" y2="160"/><line x1="100" y1="70" x2="900" y2="70"/></g>
  <g fill="#9fb3c1" font-family="system-ui,sans-serif" font-size="13"><text x="82" y="435" text-anchor="end">0.5</text><text x="82" y="345" text-anchor="end">1.0</text><text x="82" y="255" text-anchor="end">1.5</text><text x="82" y="165" text-anchor="end">2.0</text><text x="82" y="75" text-anchor="end">2.5</text><text x="100" y="458" text-anchor="middle">1K</text><text x="260" y="458" text-anchor="middle">2K</text><text x="420" y="458" text-anchor="middle">4K</text><text x="580" y="458" text-anchor="middle">8K</text><text x="740" y="458" text-anchor="middle">16K</text><text x="900" y="458" text-anchor="middle">32K suffix</text></g>
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="100,386 260,356 420,300 580,259 740,229 900,221" stroke="#64d8d5"/>
    <polyline points="100,349 260,280 420,227 580,209 740,157 900,153" stroke="#f1bd5c"/>
    <polyline points="100,352 260,283 420,223 580,202 740,169 900,174" stroke="#b58be0"/>
    <polyline points="100,359 260,292 420,224 580,208 740,198 900,204" stroke="#ed7e8a"/>
    <polyline points="100,373 260,312 420,270 580,252 740,267 900,251" stroke="#77a7eb"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#dce6ed"><line x1="135" y1="500" x2="165" y2="500" stroke="#64d8d5" stroke-width="4"/><text x="174" y="505">Fresh</text><line x1="260" y1="500" x2="290" y2="500" stroke="#f1bd5c" stroke-width="4"/><text x="299" y="505">32K</text><line x1="370" y1="500" x2="400" y2="500" stroke="#b58be0" stroke-width="4"/><text x="409" y="505">64K</text><line x1="480" y1="500" x2="510" y2="500" stroke="#ed7e8a" stroke-width="4"/><text x="519" y="505">128K</text><line x1="610" y1="500" x2="640" y2="500" stroke="#77a7eb" stroke-width="4"/><text x="649" y="505">256K cached context</text></g>
</svg>

[package]
name = "ds41rt-persist"
version = "0.1.0"
edition = "2021"
description = "Disk persistence tier for DS41RT retained snapshots: host-only interfaces, stubs and harnesses"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "copy"
harness = false
[[bench]]
name = "pool"
harness = false
[[bench]]
name = "storage"
harness = false
[[bench]]
name = "sim"
harness = false
